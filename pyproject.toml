[project]
name = "pbft"
version = "0.0.1"
description = "Naive toy BFT algorithm to learn the gory details."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Austin Rhodes", "email" = "a18rhodes@gmail.com" }]
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
    "xxhash>=4.0.1",
]

[project.scripts]
pbft = "pbft.cli:cli"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
qa = ["ruff>=0.16.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbft"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.pytest.ini_options]
addopts = "--cov=pbft --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.security.OAuth2PasswordRequestForm",
]
